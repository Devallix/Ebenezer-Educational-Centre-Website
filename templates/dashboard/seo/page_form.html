{% extends "dashboard/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="dash-card">
      <div class="dash-card-body">
        <h2 class="h5 mb-1">{{ page_title }}</h2>
        <p class="text-muted small mb-3">Leave fields blank to fall back to the global SEO defaults.</p>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="dash-btn dash-btn-primary"><i class="bi bi-check2"></i> Save page SEO</button>
            <a href="{% url 'dashboard:seo_settings' %}" class="dash-btn dash-btn-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
