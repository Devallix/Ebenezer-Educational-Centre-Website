{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Staff Sign In{% endblock %} | {{ school.school_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  <link href="{% static 'css/auth.css' %}" rel="stylesheet">
  <style>
    :root {
      --ec-primary: {{ theme_vars.primary_color }};
      --ec-secondary: {{ theme_vars.secondary_color }};
      --ec-accent: {{ theme_vars.accent_color }};
      --ec-bg: {{ theme_vars.background_color }};
      --ec-surface: {{ theme_vars.surface_color }};
      --ec-text: {{ theme_vars.text_color }};
      --ec-muted: {{ theme_vars.muted_color }};
      --ec-border: {{ theme_vars.border_color }};
    }
  </style>
</head>
<body class="auth-body">
  {% static 'images/placeholder.svg' as placeholder_img %}
  <div class="auth-slides" aria-hidden="true">
    {% for slide in slides %}
      <div class="auth-slide {% if forloop.first %}active{% endif %}"
           style="background-image:url('{% if slide.image %}{{ slide.image.url }}{% else %}{{ placeholder_img }}{% endif %}')"></div>
    {% empty %}
      <div class="auth-slide active" style="background-image:url('{% if school.default_image %}{{ school.default_image.url }}{% else %}{{ placeholder_img }}{% endif %}')"></div>
    {% endfor %}
    <div class="auth-overlay"></div>
  </div>

  <main class="auth-main">
    {% include "partials/messages.html" %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script>
    (function () {
      var slides = document.querySelectorAll(".auth-slide");
      if (slides.length < 2) return;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;
      var i = 0;
      setInterval(function () {
        slides[i].classList.remove("active");
        i = (i + 1) % slides.length;
        slides[i].classList.add("active");
      }, 6000);
    })();
  </script>
</body>
</html>
