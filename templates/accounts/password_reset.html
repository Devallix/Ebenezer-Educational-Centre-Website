{% extends "accounts/base_auth.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-panel">
  <h1 class="auth-title">Reset your password</h1>
  <p class="auth-sub">Enter your email and we will send you a link to set a new password.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-brand w-100 mt-2"><i class="bi bi-envelope"></i> Send reset link</button>
  </form>
  <div class="auth-links mt-3"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
</div>
{% endblock %}
