{% extends "accounts/base_auth.html" %}
{% load crispy_forms_tags %}
{% block title %}Set a New Password{% endblock %}
{% block content %}
<div class="auth-panel">
  <h1 class="auth-title">Set a new password</h1>
  <p class="auth-sub">Choose a strong password of at least 8 characters.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-brand w-100 mt-2"><i class="bi bi-shield-lock"></i> Save new password</button>
  </form>
  <div class="auth-links mt-3"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
</div>
{% endblock %}
