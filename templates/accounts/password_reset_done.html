{% extends "accounts/base_auth.html" %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="auth-panel text-center">
  <div class="icon-badge mx-auto" style="width:64px;height:64px;font-size:1.6rem;background:var(--ec-accent-tint);color:var(--ec-accent)">
    <i class="bi bi-envelope-check"></i>
  </div>
  <h1 class="auth-title mt-3">Check your email</h1>
  <p class="auth-sub">If an account exists for that address, we have sent a password reset link. Please check your inbox and spam folder.</p>
  <a class="btn btn-outline-brand" href="{% url 'accounts:login' %}">Back to sign in</a>
</div>
{% endblock %}
