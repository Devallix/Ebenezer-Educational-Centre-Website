{% extends "accounts/base_auth.html" %}
{% block title %}Password Updated{% endblock %}
{% block content %}
<div class="auth-panel text-center">
  <div class="icon-badge mx-auto" style="width:64px;height:64px;font-size:1.6rem"><i class="bi bi-shield-check"></i></div>
  <h1 class="auth-title mt-3">Password updated</h1>
  <p class="auth-sub">Your password has been changed. You can now sign in with your new password.</p>
  <a class="btn btn-brand" href="{% url 'accounts:login' %}"><i class="bi bi-box-arrow-in-right"></i> Sign in</a>
</div>
{% endblock %}
