{% extends "base.html" %}
{% block title %}Something went wrong | {{ school.school_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container-ec text-center" style="max-width:640px">
    <div class="empty-state">
      <i class="bi bi-exclamation-triangle" style="font-size:4rem"></i>
      <h1 class="mt-3">Something went wrong</h1>
      <p class="text-muted-ec">An unexpected error occurred. Please try again, and if the problem continues, contact the school directly.</p>
      <a class="btn btn-brand mt-3" href="{% url 'core:home' %}"><i class="bi bi-house"></i> Back to home</a>
    </div>
  </div>
</section>
{% endblock %}
