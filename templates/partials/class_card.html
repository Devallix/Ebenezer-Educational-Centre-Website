{% load static %}
<div class="ec-card reveal classes-card">
  <div class="ec-card-media">
    {% if class.image %}
      <img src="{{ class.image.url }}" alt="{{ class.image_alt|default:class.name }}" loading="lazy">
    {% else %}
      <img src="{% static 'images/placeholder.svg' %}" alt="{{ class.name }} photograph placeholder" loading="lazy">
    {% endif %}
  </div>
  <div class="ec-card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h3 class="h5 mb-0">{{ class.name }}</h3>
      {% if class.published_age_range %}<span class="badge-soft">{{ class.published_age_range }}</span>{% endif %}
    </div>
    {% if class.short_introduction %}<p class="text-muted-ec mb-0">{{ class.short_introduction|truncatewords:18 }}</p>{% endif %}
  </div>
</div>
