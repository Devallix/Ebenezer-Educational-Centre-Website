upstream ebenezer_app {
    server unix:/opt/ebenezer/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name ebenezer.edu.gh www.ebenezer.edu.gh;

    client_max_body_size 10M;

    # Uploaded media (logos, photos, gallery images)
    location /media/ {
        alias /opt/ebenezer/app/media/;
        expires 30d;
        access_log off;
    }

    # Static files are normally served by WhiteNoise; this is a faster path
    # once `collectstatic` has populated STATIC_ROOT.
    location /static/ {
        alias /opt/ebenezer/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ebenezer_app;
    }
}
